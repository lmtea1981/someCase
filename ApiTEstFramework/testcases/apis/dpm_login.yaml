  - method: POST
    apiName: '7: 根据组织ID获取plantId'
    url: 'https://{BASE_URL}/LDAP-Server/TableController/buildData'
    params: { }
    headers:
      origin: 'https://{BASE_URL}'
      referer: 'https://{BASE_URL}/'
      accept: application/json, text/plain, */*
      x-requested-with: XMLHttpRequest
      isc-app: iportal
      content-type: application/x-www-form-urlencoded
      isc-axios-sessionid:
    dataType: form
    data:
      buildClass: com.midea.component.systemImp.table.BusinessUnitTableBuilder
      isSearch: '0'
      tableId: com.midea.component.systemImp.table.BusinessUnitTableBuilder
    devopsUseCaseId: ''
    extract:
      plantId: $.data[?(@.BU_NAME=="M23")].objectId  # 提取 plantId

  - method: POST
    apiName: '8: 根据plantId切换组织'
    url: 'https://{BASE_URL}/LDAP-Server/PortalAction/changeBusinessUnit'
    params:
      objectId: '{plantId}'
      className: com.midea.profile.model.Plant
    headers:
      origin: 'https://{BASE_URL}'
      referer: 'https://{BASE_URL}/'
      accept: application/json, text/plain, */*
      x-requested-with: XMLHttpRequest
      isc-app: iportal
      content-type:
      isc-axios-sessionid:
    dataType: none
    data: ''
    devopsUseCaseId: ''
