requests:
  - method: GET
    apiName: '1: 访问首页'
    url: 'https://{BASE_URL}'
    params:
    headers: { }
    dataType: form
    data:
    devopsUseCaseId: ""

  - method: GET
    apiName: '2: 访问登录页面'
    url: 'https://{AUTH_URL}/login'
    params:
      service: https://{BASE_URL}/
    headers: { }
    dataType: form
    data:
    devopsUseCaseId: ""

  - method: POST
    apiName: '3: 提交登录表单'
    url: 'https://{AUTH_URL}/login'
    params:
      service: https://{BASE_URL}/
    headers:
      origin: 'https://{AUTH_URL}'
      referer: 'https://{AUTH_URL}/login?service=https://{BASE_URL}/'
      accept: 
        text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
      x-Requested-With: XMLHttpRequest
      isc-app: iportal
      content-Type: application/x-www-form-urlencoded
      isc-axios-sessionid:
    dataType: form
    data:
      username: '{USERNAME}'
      password: '{PASSWORD}'
      private_url_a: 'on'
      execution: e1s1
      bVisitorId: 7a6da0ed88b85a2e66c1e3d419bd702d
      bVisitorId2: 1b2ee9e160a8eaff91897fb6c60ff5bf
      _eventId: submit
      authType: sms123
      geolocation: ''
    devopsUseCaseId: ''
